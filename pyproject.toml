[project]
name = "arxiv-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "openai>=3.5.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true       

[tool.pytest.ini_options]
pythonpath = ["."]                  
